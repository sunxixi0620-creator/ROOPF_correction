<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1180" viewBox="0 0 1760 1180"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif"><text x="45" y="45" font-size="29" fill="#193B60" text-anchor="start">数据构建、模型训练与案例记忆的形成</text><text x="45" y="79" font-size="16" fill="#66758A" text-anchor="start">三类资产各司其职：Anchor 生成候选；Residual 提供排序支持；案例记忆约束 Agent 动作</text><rect x="30" y="115" width="520" height="735" rx="18" fill="#F1F8F2" stroke="#287D48" stroke-width="1.3"/><text x="50" y="145" font-size="20" fill="#287D48" text-anchor="start">1  训练环境与 Anchor</text><rect x="580" y="115" width="560" height="735" rx="18" fill="#F1F7FC" stroke="#1675B8" stroke-width="1.3"/><text x="600" y="145" font-size="20" fill="#1675B8" text-anchor="start">2  完整候选日志与 Residual</text><rect x="1170" y="115" width="560" height="735" rx="18" fill="#F6F2FB" stroke="#7450B5" stroke-width="1.3"/><text x="1190" y="145" font-size="20" fill="#7450B5" text-anchor="start">3  Agent 案例构建与准入</text><rect x="60" y="175" width="460" height="150" rx="12" fill="#FFFFFF" stroke="#287D48" stroke-width="1.3"/><text x="290.0" y="220.5" font-size="19" fill="#287D48" text-anchor="middle">36个可随机化训练函数</text><text x="290.0" y="251.5" font-size="17" fill="#243B53" text-anchor="middle">12类景观 × 每类3变体</text><text x="290.0" y="273.5" font-size="17" fill="#243B53" text-anchor="middle">平移、旋转、尺度及族内参数</text><text x="290.0" y="295.5" font-size="17" fill="#243B53" text-anchor="middle">检查数值、形状、梯度和景观覆盖</text><rect x="60" y="395" width="460" height="155" rx="12" fill="#FFFFFF" stroke="#287D48" stroke-width="1.3"/><text x="290.0" y="443.0" font-size="19" fill="#287D48" text-anchor="middle">Anchor 预训练与冻结</text><text x="290.0" y="474.0" font-size="17" fill="#243B53" text-anchor="middle">输入：种群位置及适应度</text><text x="290.0" y="496.0" font-size="17" fill="#243B53" text-anchor="middle">优化：软最优改进＋成功改进＋防坍缩</text><text x="290.0" y="518.0" font-size="17" fill="#243B53" text-anchor="middle">80轮训练来源；冻结部署权重</text><rect x="60" y="625" width="460" height="155" rx="12" fill="#FFFFFF" stroke="#193B60" stroke-width="1.3"/><text x="290.0" y="673.0" font-size="19" fill="#193B60" text-anchor="middle">Anchor 推理接口</text><text x="290.0" y="704.0" font-size="17" fill="#243B53" text-anchor="middle">排序与适应度注意力编码</text><text x="290.0" y="726.0" font-size="17" fill="#243B53" text-anchor="middle">解码两组加权候选并修复边界</text><text x="290.0" y="748.0" font-size="17" fill="#243B53" text-anchor="middle">部署时只推理，不更新网络</text><path d="M 290,325 L 290,395" fill="none" stroke="#287D48" stroke-width="2"/><polygon points="290,395 285.6503446588877,385.9955289764732 294.3496553411123,385.9955289764732" fill="#287D48"/><path d="M 290,550 L 290,625" fill="none" stroke="#287D48" stroke-width="2"/><polygon points="290,625 285.6503446588877,615.9955289764732 294.3496553411123,615.9955289764732" fill="#287D48"/><rect x="610" y="175" width="500" height="150" rx="12" fill="#FFFFFF" stroke="#1675B8" stroke-width="1.3"/><text x="860.0" y="220.5" font-size="19" fill="#1675B8" text-anchor="middle">完整池采样</text><text x="860.0" y="251.5" font-size="17" fill="#243B53" text-anchor="middle">固定 Anchor＋六算子各六候选</text><text x="860.0" y="273.5" font-size="17" fill="#243B53" text-anchor="middle">便宜生成函数上测量整池真值</text><text x="860.0" y="295.5" font-size="17" fill="#243B53" text-anchor="middle">记录状态、来源、代理预测和结果</text><rect x="610" y="395" width="500" height="155" rx="12" fill="#FFFFFF" stroke="#287D48" stroke-width="1.3"/><text x="860.0" y="443.0" font-size="19" fill="#287D48" text-anchor="middle">Residual 学习</text><text x="860.0" y="474.0" font-size="17" fill="#243B53" text-anchor="middle">标签：候选是否改善当前最优值</text><text x="860.0" y="496.0" font-size="17" fill="#243B53" text-anchor="middle">27维输入 → 128 → 128 → 1</text><text x="860.0" y="518.0" font-size="17" fill="#243B53" text-anchor="middle">带正类权重的二元交叉熵</text><rect x="610" y="625" width="500" height="155" rx="12" fill="#FFFFFF" stroke="#287D48" stroke-width="1.3"/><text x="860.0" y="674.0" font-size="18" fill="#287D48" text-anchor="middle">函数级验证与部署</text><text x="860.0" y="704.0" font-size="16" fill="#243B53" text-anchor="middle">120万行：966,569训练／233,431验证</text><text x="860.0" y="725.0" font-size="16" fill="#243B53" text-anchor="middle">7个完整函数留出；选择验证最佳权重</text><text x="860.0" y="746.0" font-size="16" fill="#243B53" text-anchor="middle">运行时输出相对改进支持分数</text><path d="M 520,480 L 565,480 L 565,250 L 610,250" fill="none" stroke="#287D48" stroke-width="2"/><polygon points="610,250 600.9955289764732,254.3496553411123 600.9955289764732,245.6503446588877" fill="#287D48"/><path d="M 860,325 L 860,395" fill="none" stroke="#1675B8" stroke-width="2"/><polygon points="860,395 855.6503446588877,385.9955289764732 864.3496553411123,385.9955289764732" fill="#1675B8"/><path d="M 860,550 L 860,625" fill="none" stroke="#287D48" stroke-width="2"/><polygon points="860,625 855.6503446588877,615.9955289764732 864.3496553411123,615.9955289764732" fill="#287D48"/><rect x="1200" y="175" width="500" height="150" rx="12" fill="#FFFFFF" stroke="#7450B5" stroke-width="1.3"/><text x="1450.0" y="221.5" font-size="18" fill="#7450B5" text-anchor="middle">相同状态下枚举22个动作</text><text x="1450.0" y="251.5" font-size="16" fill="#243B53" text-anchor="middle">36函数 × 8种子 × 2决策时刻</text><text x="1450.0" y="272.5" font-size="16" fill="#243B53" text-anchor="middle">5／10轮配对收益对默认动作归一化</text><text x="1450.0" y="293.5" font-size="16" fill="#243B53" text-anchor="middle">生成控制延迟1轮，融合立即生效</text><rect x="1200" y="395" width="500" height="155" rx="12" fill="#FFFFFF" stroke="#7450B5" stroke-width="1.3"/><text x="1450.0" y="444.0" font-size="18" fill="#7450B5" text-anchor="middle">案例与覆盖校准</text><text x="1450.0" y="474.0" font-size="16" fill="#243B53" text-anchor="middle">576上下文：464检索／112留出</text><text x="1450.0" y="495.0" font-size="16" fill="#243B53" text-anchor="middle">16维特征；同决策时刻检索3个不同函数</text><text x="1450.0" y="516.0" font-size="16" fill="#243B53" text-anchor="middle">留出样本仅用于特征覆盖半径</text><rect x="1200" y="625" width="500" height="155" rx="12" fill="#FFFFFF" stroke="#7450B5" stroke-width="1.3"/><text x="1450.0" y="673.0" font-size="19" fill="#7450B5" text-anchor="middle">动作进入 allowed 集合</text><text x="1450.0" y="704.0" font-size="17" fill="#243B53" text-anchor="middle">默认动作始终可用</text><text x="1450.0" y="726.0" font-size="17" fill="#243B53" text-anchor="middle">覆盖成立＋至少2个邻居正收益</text><text x="1450.0" y="748.0" font-size="17" fill="#243B53" text-anchor="middle">短期增益过阈值，长期增益非负</text><path d="M 1110,730 L 1153,730 L 1153,250 L 1200,250" fill="none" stroke="#7450B5" stroke-width="2"/><polygon points="1200,250 1190.9955289764732,254.3496553411123 1190.9955289764732,245.6503446588877" fill="#7450B5"/><path d="M 1450,325 L 1450,395" fill="none" stroke="#7450B5" stroke-width="2"/><polygon points="1450,395 1445.6503446588877,385.9955289764732 1454.3496553411123,385.9955289764732" fill="#7450B5"/><path d="M 1450,550 L 1450,625" fill="none" stroke="#7450B5" stroke-width="2"/><polygon points="1450,625 1445.6503446588877,615.9955289764732 1454.3496553411123,615.9955289764732" fill="#7450B5"/><rect x="80" y="930" width="1600" height="130" rx="12" fill="#F1F5FA" stroke="#193B60" stroke-width="1.3"/><text x="880.0" y="976.0" font-size="20" fill="#193B60" text-anchor="middle">部署时加载冻结资产，进入全量测试</text><text x="880.0" y="1008.0" font-size="18" fill="#243B53" text-anchor="middle">测试函数不作为神经模型训练行或 Agent 反事实标签；LLM不在本项目内微调</text><text x="880.0" y="1031.0" font-size="18" fill="#243B53" text-anchor="middle">在线新信息仅来自已评价档案与选中点反馈，神经权重和案例库不随测试更新</text><path d="M 290,780 L 290,930" fill="none" stroke="#66758A" stroke-width="2" stroke-dasharray="7 5"/><polygon points="290,930 285.6503446588877,920.9955289764732 294.3496553411123,920.9955289764732" fill="#66758A"/><path d="M 860,780 L 860,930" fill="none" stroke="#66758A" stroke-width="2" stroke-dasharray="7 5"/><polygon points="860,930 855.6503446588877,920.9955289764732 864.3496553411123,920.9955289764732" fill="#66758A"/><path d="M 1450,780 L 1450,930" fill="none" stroke="#66758A" stroke-width="2" stroke-dasharray="7 5"/><polygon points="1450,930 1445.6503446588877,920.9955289764732 1454.3496553411123,920.9955289764732" fill="#66758A"/></g></svg>
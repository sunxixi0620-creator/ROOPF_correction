<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1400" viewBox="0 0 1760 1400"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif"><text x="45" y="45" font-size="29" fill="#193B60" text-anchor="start">单轮迭代：候选生成—证据组装—动作执行—真实反馈</text><text x="45" y="79" font-size="16" fill="#66758A" text-anchor="start">先构造并预测当前候选，再允许 LLM 决策；未评价候选的目标真值不进入在线输入</text><rect x="570" y="125" width="620" height="105" rx="12" fill="#FFFFFF" stroke="#193B60" stroke-width="1.3"/><text x="880.0" y="158.5" font-size="20" fill="#193B60" text-anchor="middle">初始化</text><text x="880.0" y="190.5" font-size="18" fill="#243B53" text-anchor="middle">采样100点并真实评价；排序保留100点</text><text x="880.0" y="213.5" font-size="18" fill="#243B53" text-anchor="middle">建立评价档案、成功记忆及反馈历史</text><rect x="570" y="285" width="620" height="105" rx="12" fill="#FFFFFF" stroke="#193B60" stroke-width="1.3"/><text x="880.0" y="318.5" font-size="20" fill="#193B60" text-anchor="middle">计算本轮状态</text><text x="880.0" y="350.5" font-size="18" fill="#243B53" text-anchor="middle">已用／剩余预算、停滞与多样性等11维描述</text><text x="880.0" y="373.5" font-size="18" fill="#243B53" text-anchor="middle">检查是否到达300 FE；计算是否开放竞争</text><rect x="570" y="445" width="620" height="115" rx="12" fill="#FFFFFF" stroke="#1675B8" stroke-width="1.3"/><text x="880.0" y="484.0" font-size="19" fill="#1675B8" text-anchor="middle">产生候选并修复边界</text><text x="880.0" y="515.0" font-size="17" fill="#243B53" text-anchor="middle">Anchor两点＋六算子36点；竞争阶段增加1个提议</text><text x="880.0" y="537.0" font-size="17" fill="#243B53" text-anchor="middle">读取上一轮保存的生成计划，形成38个竞争候选</text><rect x="570" y="620" width="620" height="115" rx="12" fill="#FFFFFF" stroke="#1675B8" stroke-width="1.3"/><text x="880.0" y="659.0" font-size="19" fill="#1675B8" text-anchor="middle">当前候选的代理与Residual预测</text><text x="880.0" y="690.0" font-size="17" fill="#243B53" text-anchor="middle">档案重拟合5成员岭回归；产生均值与不确定度</text><text x="880.0" y="712.0" font-size="17" fill="#243B53" text-anchor="middle">冻结Residual打分；预演融合倍率0／1／2</text><rect x="570" y="795" width="620" height="115" rx="12" fill="#FFFFFF" stroke="#7450B5" stroke-width="1.3"/><text x="880.0" y="834.0" font-size="19" fill="#7450B5" text-anchor="middle">选择本轮融合与下一轮生成计划</text><text x="880.0" y="865.0" font-size="17" fill="#243B53" text-anchor="middle">在指定时刻拼接16维状态、案例和已测历史</text><text x="880.0" y="887.0" font-size="17" fill="#243B53" text-anchor="middle">合法LLM动作应用；失败或不合法行用 matched38</text><rect x="570" y="970" width="620" height="105" rx="12" fill="#FFFFFF" stroke="#7450B5" stroke-width="1.3"/><text x="880.0" y="1004.0" font-size="19" fill="#7450B5" text-anchor="middle">保护门决定实际评价集合</text><text x="880.0" y="1035.0" font-size="17" fill="#243B53" text-anchor="middle">保护Anchor保留；竞争候选需满足风险优势阈值</text><text x="880.0" y="1057.0" font-size="17" fill="#243B53" text-anchor="middle">未通过则用竞争Anchor；最多评价两点</text><rect x="570" y="1130" width="620" height="105" rx="12" fill="#FFFFFF" stroke="#C87415" stroke-width="1.3"/><text x="880.0" y="1164.0" font-size="19" fill="#C87415" text-anchor="middle">评价并更新</text><text x="880.0" y="1195.0" font-size="17" fill="#243B53" text-anchor="middle">真实目标评价 → 档案／种群／成功记忆／反馈</text><text x="880.0" y="1217.0" font-size="17" fill="#243B53" text-anchor="middle">预算增加2；记录真实决策及API执行对应关系</text><path d="M 880,230 L 880,285" fill="none" stroke="#66758A" stroke-width="2"/><polygon points="880,285 875.6503446588877,275.9955289764732 884.3496553411123,275.9955289764732" fill="#66758A"/><path d="M 880,390 L 880,445" fill="none" stroke="#66758A" stroke-width="2"/><polygon points="880,445 875.6503446588877,435.9955289764732 884.3496553411123,435.9955289764732" fill="#66758A"/><path d="M 880,560 L 880,620" fill="none" stroke="#66758A" stroke-width="2"/><polygon points="880,620 875.6503446588877,610.9955289764732 884.3496553411123,610.9955289764732" fill="#66758A"/><path d="M 880,735 L 880,795" fill="none" stroke="#66758A" stroke-width="2"/><polygon points="880,795 875.6503446588877,785.9955289764732 884.3496553411123,785.9955289764732" fill="#66758A"/><path d="M 880,910 L 880,970" fill="none" stroke="#66758A" stroke-width="2"/><polygon points="880,970 875.6503446588877,960.9955289764732 884.3496553411123,960.9955289764732" fill="#66758A"/><path d="M 880,1075 L 880,1130" fill="none" stroke="#66758A" stroke-width="2"/><polygon points="880,1130 875.6503446588877,1120.9955289764732 884.3496553411123,1120.9955289764732" fill="#66758A"/><rect x="45" y="340" width="440" height="155" rx="12" fill="#FFFFFF" stroke="#193B60" stroke-width="1.3"/><text x="265.0" y="388.0" font-size="19" fill="#193B60" text-anchor="middle">评价阶段分流</text><text x="265.0" y="419.0" font-size="17" fill="#243B53" text-anchor="middle">FE＜210：两点均由Anchor提供</text><text x="265.0" y="441.0" font-size="17" fill="#243B53" text-anchor="middle">FE≥210：非CEC可进行保护竞争</text><text x="265.0" y="463.0" font-size="17" fill="#243B53" text-anchor="middle">CEC结构锁下不调用LLM</text><path d="M 485,415 L 535,415 L 535,1022 L 570,1022" fill="none" stroke="#193B60" stroke-width="2"/><polygon points="570,1022 560.9955289764732,1026.3496553411123 560.9955289764732,1017.6503446588877" fill="#193B60"/><rect x="1265" y="445" width="440" height="115" rx="12" fill="#FFFFFF" stroke="#7450B5" stroke-width="1.3"/><text x="1485.0" y="484.0" font-size="19" fill="#7450B5" text-anchor="middle">当前已生成的池不可回改</text><text x="1485.0" y="515.0" font-size="17" fill="#243B53" text-anchor="middle">新的温度／局部尺度计划</text><text x="1485.0" y="537.0" font-size="17" fill="#243B53" text-anchor="middle">仅在下一轮开始读取</text><path d="M 1190,850 L 1230,850 L 1230,500 L 1265,500" fill="none" stroke="#7450B5" stroke-width="2" stroke-dasharray="7 5"/><polygon points="1265,500 1255.9955289764732,504.3496553411123 1255.9955289764732,495.6503446588877" fill="#7450B5"/><path d="M 1485,445 L 1485,410 L 1120,410 L 1120,445" fill="none" stroke="#7450B5" stroke-width="2" stroke-dasharray="7 5"/><polygon points="1120,445 1115.6503446588877,435.9955289764732 1124.3496553411123,435.9955289764732" fill="#7450B5"/><rect x="1265" y="690" width="440" height="170" rx="12" fill="#FFFFFF" stroke="#7450B5" stroke-width="1.3"/><text x="1485.0" y="736.0" font-size="18" fill="#7450B5" text-anchor="middle">LLM调用前的动作约束</text><text x="1485.0" y="766.0" font-size="16" fill="#243B53" text-anchor="middle">剩余阶段计数 k=5 或 k=15 才调用</text><text x="1485.0" y="787.0" font-size="16" fill="#243B53" text-anchor="middle">allowed由离线覆盖与收益支持确定</text><text x="1485.0" y="808.0" font-size="16" fill="#243B53" text-anchor="middle">只输出预定义动作字符串</text><text x="1485.0" y="829.0" font-size="16" fill="#243B53" text-anchor="middle">无当前候选真实值，无自由生成代码</text><path d="M 1265,820 L 1190,850" fill="none" stroke="#7450B5" stroke-width="2"/><polygon points="1190,850 1196.7450200200533,842.6172698187542 1199.9758628981392,850.6943770139688" fill="#7450B5"/><rect x="45" y="1060" width="440" height="150" rx="12" fill="#FFFFFF" stroke="#C87415" stroke-width="1.3"/><text x="265.0" y="1105.5" font-size="19" fill="#C87415" text-anchor="middle">FE达到300时停止</text><text x="265.0" y="1136.5" font-size="17" fill="#243B53" text-anchor="middle">输出本条轨迹的最优已测目标值</text><text x="265.0" y="1158.5" font-size="17" fill="#243B53" text-anchor="middle">每函数100条轨迹计算均值和方差</text><text x="265.0" y="1180.5" font-size="17" fill="#243B53" text-anchor="middle">BBOB24／CEC-style6／UAV5分类报告</text><path d="M 570,1182 L 485,1182" fill="none" stroke="#C87415" stroke-width="2"/><polygon points="485,1182 494.0044710235268,1177.6503446588877 494.0044710235268,1186.3496553411123" fill="#C87415"/><path d="M 880,1235 L 880,1310 L 520,1310 L 520,335 L 570,335" fill="none" stroke="#66758A" stroke-width="2"/><polygon points="570,335 560.9955289764732,339.3496553411123 560.9955289764732,330.6503446588877" fill="#66758A"/><text x="610" y="1295" font-size="15" fill="#66758A" text-anchor="start">预算未满：下一轮</text><text x="55" y="1368" font-size="18" fill="#66758A" text-anchor="start">档案超过256条时压缩为最优100条＋最近128条；种群始终保留最优100点。</text></g></svg>
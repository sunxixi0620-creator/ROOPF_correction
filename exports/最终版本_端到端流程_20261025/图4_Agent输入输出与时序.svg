<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1120" viewBox="0 0 1760 1120"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif"><text x="45" y="45" font-size="29" fill="#193B60" text-anchor="start">Agent如何融合：输入、动作分解与生效时序</text><text x="45" y="79" font-size="16" fill="#66758A" text-anchor="start">两个控制量的时序不同：当前池融合立即应用；候选生成参数从下一轮生效</text><rect x="40" y="145" width="390" height="125" rx="12" fill="#FFFFFF" stroke="#1675B8" stroke-width="1.3"/><text x="235.0" y="189.0" font-size="19" fill="#1675B8" text-anchor="middle">16维状态</text><text x="235.0" y="220.0" font-size="17" fill="#243B53" text-anchor="middle">预算、停滞、几何分散</text><text x="235.0" y="242.0" font-size="17" fill="#243B53" text-anchor="middle">当前冲突、分歧与可靠性</text><rect x="470" y="145" width="390" height="125" rx="12" fill="#FFFFFF" stroke="#1675B8" stroke-width="1.3"/><text x="665.0" y="189.0" font-size="19" fill="#1675B8" text-anchor="middle">当前数值选项</text><text x="665.0" y="220.0" font-size="17" fill="#243B53" text-anchor="middle">λ=0／1／2的选择位置</text><text x="665.0" y="242.0" font-size="17" fill="#243B53" text-anchor="middle">预测均值、不确定度与差距</text><rect x="900" y="145" width="390" height="125" rx="12" fill="#FFFFFF" stroke="#1675B8" stroke-width="1.3"/><text x="1095.0" y="189.0" font-size="19" fill="#1675B8" text-anchor="middle">离线案例与准入</text><text x="1095.0" y="220.0" font-size="17" fill="#243B53" text-anchor="middle">3个不同训练函数邻居</text><text x="1095.0" y="242.0" font-size="17" fill="#243B53" text-anchor="middle">5／10轮增益和allowed动作</text><rect x="1330" y="145" width="390" height="125" rx="12" fill="#FFFFFF" stroke="#1675B8" stroke-width="1.3"/><text x="1525.0" y="189.0" font-size="19" fill="#1675B8" text-anchor="middle">已测反馈</text><text x="1525.0" y="220.0" font-size="17" fill="#243B53" text-anchor="middle">选中点误差、来源成功统计</text><text x="1525.0" y="242.0" font-size="17" fill="#243B53" text-anchor="middle">最近观测；缺失保持未知</text><rect x="500" y="365" width="760" height="120" rx="12" fill="#FFFFFF" stroke="#7450B5" stroke-width="1.3"/><text x="880.0" y="406.0" font-size="20" fill="#7450B5" text-anchor="middle">LLM API：每轨迹输出一个合法动作字符串</text><text x="880.0" y="438.0" font-size="18" fill="#243B53" text-anchor="middle">例如 local_wide@online：局部尺度1.5，融合倍率0</text><text x="880.0" y="461.0" font-size="18" fill="#243B53" text-anchor="middle">不输出目标值、不修改代码、不直接触发额外评价</text><path d="M 235,270 L 235,320 L 880,320 L 880,365" fill="none" stroke="#7450B5" stroke-width="2"/><polygon points="880,365 875.6503446588877,355.9955289764732 884.3496553411123,355.9955289764732" fill="#7450B5"/><path d="M 665,270 L 665,320 L 880,320 L 880,365" fill="none" stroke="#7450B5" stroke-width="2"/><polygon points="880,365 875.6503446588877,355.9955289764732 884.3496553411123,355.9955289764732" fill="#7450B5"/><path d="M 1095,270 L 1095,320 L 880,320 L 880,365" fill="none" stroke="#7450B5" stroke-width="2"/><polygon points="880,365 875.6503446588877,355.9955289764732 884.3496553411123,355.9955289764732" fill="#7450B5"/><path d="M 1525,270 L 1525,320 L 880,320 L 880,365" fill="none" stroke="#7450B5" stroke-width="2"/><polygon points="880,365 875.6503446588877,355.9955289764732 884.3496553411123,355.9955289764732" fill="#7450B5"/><rect x="140" y="555" width="650" height="115" rx="12" fill="#FFFFFF" stroke="#7450B5" stroke-width="1.3"/><text x="465.0" y="593.5" font-size="20" fill="#7450B5" text-anchor="middle">融合控制 λ∈{0,1,2}</text><text x="465.0" y="625.5" font-size="18" fill="#243B53" text-anchor="middle">当前轮＋随后4轮，共5轮</text><text x="465.0" y="648.5" font-size="18" fill="#243B53" text-anchor="middle">对当前已生成候选进行保护性重排序</text><rect x="970" y="555" width="650" height="115" rx="12" fill="#FFFFFF" stroke="#1675B8" stroke-width="1.3"/><text x="1295.0" y="593.5" font-size="20" fill="#1675B8" text-anchor="middle">生成控制 (温度T，局部尺度s)</text><text x="1295.0" y="625.5" font-size="18" fill="#243B53" text-anchor="middle">仅随后4轮，不改变当前候选池</text><text x="1295.0" y="648.5" font-size="18" fill="#243B53" text-anchor="middle">T∈{0.8,1,1.25}；s∈{0.5,1,1.5}</text><path d="M 720,485 L 720,525 L 465,525 L 465,555" fill="none" stroke="#7450B5" stroke-width="2"/><polygon points="465,555 460.6503446588877,545.9955289764732 469.3496553411123,545.9955289764732" fill="#7450B5"/><path d="M 1040,485 L 1040,525 L 1295,525 L 1295,555" fill="none" stroke="#1675B8" stroke-width="2"/><polygon points="1295,555 1290.6503446588877,545.9955289764732 1299.3496553411123,545.9955289764732" fill="#1675B8"/><rect x="40" y="735" width="1680" height="280" rx="18" fill="#F5F8FC" stroke="#193B60" stroke-width="1.3"/><text x="60" y="765" font-size="20" fill="#193B60" text-anchor="start">固定预算上的时序（活跃阶段编号从0开始）</text><path d="M 100,855 L 1650,855" fill="none" stroke="#193B60" stroke-width="2"/><polygon points="1650,855 1640.9955289764732,859.3496553411123 1640.9955289764732,850.6503446588877" fill="#193B60"/><path d="M 100.0,845 L 100.0,867" fill="none" stroke="#193B60" stroke-width="2"/><polygon points="100.0,867 95.6503446588877,857.9955289764732 104.34965534111231,857.9955289764732" fill="#193B60"/><text x="100.0" y="820" font-size="17" fill="#193B60" text-anchor="middle">100 FE</text><text x="100.0" y="900" font-size="16" fill="#243B53" text-anchor="middle">初始评价完成</text><path d="M 952.5000000000001,845 L 952.5000000000001,867" fill="none" stroke="#193B60" stroke-width="2"/><polygon points="952.5000000000001,867 948.1503446588878,857.9955289764732 956.8496553411125,857.9955289764732" fill="#193B60"/><text x="952.5000000000001" y="820" font-size="17" fill="#193B60" text-anchor="middle">210 FE</text><text x="952.5000000000001" y="900" font-size="16" fill="#243B53" text-anchor="middle">开放保护竞争</text><path d="M 1030.0,845 L 1030.0,867" fill="none" stroke="#193B60" stroke-width="2"/><polygon points="1030.0,867 1025.6503446588877,857.9955289764732 1034.3496553411123,857.9955289764732" fill="#193B60"/><text x="1030.0" y="820" font-size="17" fill="#193B60" text-anchor="middle">220 FE</text><text x="1030.0" y="930" font-size="16" fill="#7450B5" text-anchor="middle">LLM决策1</text><path d="M 1185.0,845 L 1185.0,867" fill="none" stroke="#193B60" stroke-width="2"/><polygon points="1185.0,867 1180.6503446588877,857.9955289764732 1189.3496553411123,857.9955289764732" fill="#193B60"/><text x="1185.0" y="820" font-size="17" fill="#193B60" text-anchor="middle">240 FE</text><text x="1185.0" y="900" font-size="16" fill="#7450B5" text-anchor="middle">LLM决策2</text><path d="M 1650.0,845 L 1650.0,867" fill="none" stroke="#193B60" stroke-width="2"/><polygon points="1650.0,867 1645.6503446588877,857.9955289764732 1654.3496553411123,857.9955289764732" fill="#193B60"/><text x="1650.0" y="820" font-size="17" fill="#193B60" text-anchor="middle">300 FE</text><text x="1650.0" y="900" font-size="16" fill="#243B53" text-anchor="middle">停止</text><text x="85" y="960" font-size="19" fill="#7450B5" text-anchor="start">决策1：融合 k=5—9；生成 k=6—9。    决策2：融合 k=15—19；生成 k=16—19。</text><text x="55" y="1070" font-size="18" fill="#66758A" text-anchor="start">每10条轨迹合并一次请求；29个非CEC函数 × 10批 × 2个时刻 = 580次实际API请求。</text></g></svg>